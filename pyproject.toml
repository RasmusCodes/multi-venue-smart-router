[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smartrouter"
version = "0.1.0"
description = "Multi-venue smart order routing: a latency-aware market simulator, routing strategies and pre-registered experiments."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RasmusCodes" }]
requires-python = ">=3.10"
dependencies = []  # the simulator and routers use the standard library only (they also run in the browser via Pyodide)

[project.optional-dependencies]
research = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]
dev = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
